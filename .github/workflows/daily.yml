name: daily-watch

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 평일 07:00 KST (UTC 22:00)
  workflow_dispatch:          # 수동 실행

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 감시 실행
        run: python tools/watch.py | tee watch_output.txt

      - name: 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cat watch_output.txt | python tools/notify.py

      - name: 이슈 생성 (변화 있을 때만)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('watch_output.txt', 'utf8');
            if (body.includes('변화 없음')) return;
            const today = new Date().toISOString().slice(0,10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[감시] ${today}`,
              body: '```\n' + body + '\n```',
              labels: ['watch']
            });
