name: apply-judgment

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    # 본문이 명령어로 시작하는 이슈만 처리
    if: startsWith(github.event.issue.body, '/judge') ||
        startsWith(github.event.issue.body, '/queue') ||
        startsWith(github.event.issue.body, '/drop')  ||
        startsWith(github.event.issue.body, '/move')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 본문 저장
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/issue.txt

      - name: 반영
        id: apply
        run: |
          set +e
          OUT=$(python tools/apply_judgment.py /tmp/issue.txt 2>&1)
          CODE=$?
          echo "code=$CODE" >> $GITHUB_OUTPUT
          { echo 'msg<<EOF'; echo "$OUT"; echo 'EOF'; } >> $GITHUB_OUTPUT
          exit 0

      - name: 커밋
        if: steps.apply.outputs.code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "판정 반영 (#${{ github.event.issue.number }})"
          git push

      - name: 대시보드 갱신
        if: steps.apply.outputs.code == '0'
        run: |
          python tools/build.py || true
          git add docs/index.html
          git diff --staged --quiet || git commit -m "chore: 대시보드 갱신"
          git push || true

      - name: 결과 회신
        uses: actions/github-script@v7
        with:
          script: |
            const ok  = '${{ steps.apply.outputs.code }}' === '0';
            const msg = `${{ toJSON(steps.apply.outputs.msg) }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: (ok ? '' : '반영하지 않았다. 본문을 고쳐 저장하면 다시 시도한다.\n\n') + '```\n' + msg + '\n```'
            });
            if (ok) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, labels: ['judged']
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed'
              });
            }
